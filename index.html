<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace Jeunesse</title>
<meta name="description" content="Suivi des groupes, feuille d'appel des assises et bibliothèque de dars.">
<meta name="theme-color" content="#0f4c45">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📗</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="brand-mark">EJ</span>
      <span class="brand-txt">Espace Jeunesse</span>
    </div>
    <button class="icon-btn" id="btn-reglages" title="Réglages" aria-label="Réglages">⚙</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-view="accueil" class="tab is-active"><span class="tab-ico">◉</span>Accueil</button>
  <button data-view="appel" class="tab"><span class="tab-ico">✓</span>Appel</button>
  <button data-view="groupes" class="tab"><span class="tab-ico">☰</span>Groupes</button>
  <button data-view="dars" class="tab"><span class="tab-ico">▤</span>Dars</button>
</nav>

<main id="app" class="app"></main>

<div class="modal-back" id="modal-back" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="modal-title">Titre</h2>
      <button class="icon-btn" id="modal-close" aria-label="Fermer">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
